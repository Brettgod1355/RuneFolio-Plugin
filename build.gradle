plugins {
    id "java"
}

repositories {
    mavenLocal()
    maven {
        url = "https://repo.runelite.net"
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = "latest.release"
def pluginMainClass = "app.runefolio.sync.RuneFolioPluginTest"

dependencies {
    compileOnly group: "net.runelite", name: "client", version: runeLiteVersion

    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"

    testImplementation "junit:junit:4.12"
    testImplementation group: "net.runelite", name: "client", version: runeLiteVersion
    testImplementation group: "net.runelite", name: "jshell", version: runeLiteVersion
}

group = "app.runefolio"
version = "0.3.35"

tasks.register("verifyDistributionNotices") {
    dependsOn tasks.named("jar")
    doLast {
        def archive = zipTree(tasks.named("jar").get().archiveFile.get().asFile)
        ["LICENSE", "COPYRIGHT.md", "THIRD_PARTY_NOTICES.md"].each { name ->
            def notice = archive.matching { include "META-INF/${name}" }.singleFile
            if (notice.getText("UTF-8") != file(name).getText("UTF-8")) {
                throw new GradleException("Distribution notice differs: ${name}")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(11)
}

tasks.register("run", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass

    jvmArgs "-ea"
    args "--developer-mode", "--debug"
}

tasks.register("queueBenchmark", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "app.runefolio.sync.RuneFolioQueueBenchmark"
    maxHeapSize = "512m"
}

tasks.register("performanceBenchmark", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "app.runefolio.sync.RuneFolioPerformanceBenchmark"
    maxHeapSize = "512m"
    systemProperty "java.awt.headless", "true"
}
