name: Discord notifications

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: ['CI', 'Plugin Hub preflight']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR to deliver; leave empty to send a private test alert'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: discord-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The manager origin is a repository secret, never a variable: a step's env
      # block is printed in the job log, where variables appear in clear and
      # secrets are masked. A secret cannot gate a job-level `if`, so this step
      # decides whether there is anything to send.
      - id: config
        env:
          DISCORD_EVENTS_URL: ${{ secrets.DISCORD_EVENTS_URL }}
        run: |
          if [ -n "$DISCORD_EVENTS_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Discord notifications are not configured for this repository; nothing to send."
          fi
      # Never check out the PR head or execute untrusted contributor code here.
      - if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - if: steps.config.outputs.configured == 'true'
        run: node scripts/notify-discord.mjs
        env:
          DISCORD_SOURCE: plugin
          DISCORD_EVENTS_URL: ${{ secrets.DISCORD_EVENTS_URL }}
          DISCORD_EVENTS_SECRET: ${{ secrets.DISCORD_EVENTS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
