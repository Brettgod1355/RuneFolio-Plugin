name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle test verifyDistributionNotices
      - run: bash scripts/check-plugin-hub-disallowed-apis.sh
      - if: github.event_name == 'pull_request'
        run: bash scripts/check-version-bump.sh "$GITHUB_BASE_REF"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
