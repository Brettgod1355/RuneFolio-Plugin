name: Notification format tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  notification-format:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node --test scripts/notify-discord.test.mjs
