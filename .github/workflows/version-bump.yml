name: Version bump

# Its own workflow so a title edit re-runs only this check, not the full build:
# the default pull_request types never fire on "edited", and the Discord
# changelog title is read from the PR title at merge time.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-bump:
    # "edited" also fires on an already-merged PR, where the base branch necessarily
    # contains the version already, so the check would fail with "not newer than main"
    # -- a tautology no merged PR can pass. GitHub shows the newest run per check name,
    # so that leaves a permanent red X on merged PRs that means nothing.
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-version-bump.sh "$GITHUB_BASE_REF"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
